services:
  - type: web
    name: documindai-geg6
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
